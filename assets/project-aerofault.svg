<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="project-aerofault-t">
  <title id="project-aerofault-t">AeroFaultAI: Real-time aerospace telemetry anomaly detection and predictive diagnostics.</title>
  <defs>
    <linearGradient id="project-aerofault-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140D24"/><stop offset="1" stop-color="#0B0714"/></linearGradient>
    <radialGradient id="project-aerofault-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#7C3AED" stop-opacity=".7"/><stop offset="1" stop-color="#3B0764" stop-opacity="0"/></radialGradient>
    <pattern id="project-aerofault-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8B5CF6" stroke-opacity=".08"/></pattern>
    <clipPath id="project-aerofault-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="project-aerofault-trace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .p-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-in { animation: p-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p-d1 { animation-delay: .15s; } .p-d2 { animation-delay: .4s; }
    .p-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .p-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p-trace 7s linear infinite; }
    @keyframes p-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p-draw { to { stroke-dashoffset: 0; } }
    @keyframes p-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-in { animation: none; } .p-draw { animation: none; stroke-dashoffset: 0; } .p-trace { display: none; } }
  </style>
  <g clip-path="url(#project-aerofault-clip)">
    <rect width="1200" height="370" fill="url(#project-aerofault-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#project-aerofault-grid)"/>
    <rect width="1200" height="370" fill="url(#project-aerofault-glow)"/>
    <g class="p-in p-d1">
      <text class="p-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#A78BFA">03 · PREDICTIVE ML · TIME-SERIES TELEMETRY · 2026</text>
      <text class="p-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#FFFFFF">AeroFaultAI</text>
      <text class="p-sans" x="56" y="166" font-size="17" fill="#C4B5FD">Real-time aerospace telemetry anomaly detection and predictive diagnostics.</text>
      <text class="p-mono" x="56" y="200" font-size="12.5" fill="#DDD6FE"><tspan fill="#A78BFA">BUILT ›</tspan> Multi-sensor time-series modeling, anomaly classification, and automated alerts</text>
      <line class="p-draw" x1="56" y1="226" x2="680" y2="226" stroke="#8B5CF6" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p-serif" font-size="34" font-weight="300" fill="#FFFFFF">98.2%</text><text class="p-sans" y="24" font-size="12.5" fill="#A79FB5">anomaly F1-score</text></g>
      <g transform="translate(261 266)"><text class="p-serif" font-size="34" font-weight="300" fill="#FFFFFF"><50ms</text><text class="p-sans" y="24" font-size="12.5" fill="#A79FB5">inference latency</text></g>
      <g transform="translate(466 266)"><text class="p-serif" font-size="34" font-weight="300" fill="#FFFFFF">100k+</text><text class="p-sans" y="24" font-size="12.5" fill="#A79FB5">telemetry records</text></g>
      <g class="p-chip" style="animation-delay:1.00s">
          <rect x="56" y="314" width="78" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/>
          <text class="p-mono" x="95.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Python</text>
        </g>\n<g class="p-chip" style="animation-delay:1.12s">
          <rect x="144" y="314" width="87" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/>
          <text class="p-mono" x="187.5" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">PyTorch</text>
        </g>\n<g class="p-chip" style="animation-delay:1.24s">
          <rect x="241" y="314" width="132" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/>
          <text class="p-mono" x="307.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Scikit-Learn</text>
        </g>\n<g class="p-chip" style="animation-delay:1.36s">
          <rect x="383" y="314" width="87" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/>
          <text class="p-mono" x="426.5" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">FastAPI</text>
        </g>\n<g class="p-chip" style="animation-delay:1.48s">
          <rect x="480" y="314" width="78" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/>
          <text class="p-mono" x="519.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Plotly</text>
        </g>
    </g>
    <!-- Right Diagram Area -->
    <g class="p-in p-d2">
      <g transform="translate(780 40)">
  <rect x="0" y="0" width="370" height="290" rx="14" fill="#0B0714" stroke="#8B5CF6" stroke-opacity=".35"/>
  <text class="p-mono" x="30" y="36" font-size="11" letter-spacing="1.5" fill="#A78BFA">LIVE TELEMETRY STREAM</text>
  <!-- Telemetry waveform -->
  <path d="M30 110 L80 110 L100 85 L120 135 L140 110 L190 110 L210 60 L230 160 L250 110 L300 110 L340 110" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="220" cy="110" r="28" fill="#EF4444" fill-opacity=".15" stroke="#EF4444" stroke-width="1.2">
    <animate attributeName="r" values="20;32;20" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="p-mono" x="220" y="50" text-anchor="middle" font-size="10" fill="#EF4444">FAULT SPIKE DETECTED</text>
  <!-- Diagnostics box -->
  <g transform="translate(30 190)">
    <rect width="310" height="74" rx="10" fill="#140D24" stroke="#8B5CF6" stroke-opacity=".3"/>
    <text class="p-mono" x="18" y="26" font-size="11" fill="#FFFFFF">STATUS: Component #4 Failure Risk</text>
    <text class="p-mono" x="18" y="46" font-size="10.5" fill="#DDD6FE">Confidence: 98.2% · Time to Failure: 48h</text>
    <text class="p-mono" x="18" y="64" font-size="10" fill="#10B981">Action: Auto-Ticket Dispatched to Maintenance</text>
  </g>
</g>
    </g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#8B5CF6" stroke-opacity=".2"/>
    <rect class="p-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#project-aerofault-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>