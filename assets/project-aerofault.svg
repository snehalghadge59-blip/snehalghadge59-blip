<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p-analytics-t">
  <title id="p-analytics-t">Product Funnel &amp; Cohort Retention Analytics: End-to-end user conversion, cohort retention, and customer analytics.</title>
  <defs>
    <linearGradient id="p-aerofault-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140D24"/><stop offset="1" stop-color="#0B0714"/></linearGradient>
    <radialGradient id="p-aerofault-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#7C3AED" stop-opacity=".7"/><stop offset="1" stop-color="#3B0764" stop-opacity="0"/></radialGradient>
    <pattern id="p-aerofault-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8B5CF6" stroke-opacity=".08"/></pattern>
    <clipPath id="p-aerofault-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p-aerofault-trace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .p-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
    .p-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .p-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .p-in{animation:p-in 1.2s cubic-bezier(.16,1,.3,1) both}
    .p-d1{animation-delay:.15s} .p-d2{animation-delay:.4s}
    .p-draw{stroke-dasharray:600;stroke-dashoffset:600;animation:p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
    .p-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:p-trace 7s linear infinite}
    .p-chip{animation:p-chip .7s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes p-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes p-draw{to{stroke-dashoffset:0}}
    @keyframes p-trace{to{stroke-dashoffset:0}}
    @keyframes p-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.p-in,.p-chip{animation:none}.p-draw{animation:none;stroke-dashoffset:0}.p-trace{display:none}}
  </style>
  <g clip-path="url(#p-aerofault-clip)">
    <rect width="1200" height="370" fill="url(#p-aerofault-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p-aerofault-grid)"/>
    <rect width="1200" height="370" fill="url(#p-aerofault-glow)"/>
    <g class="p-in p-d1">
      <text class="p-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#38BDF8">01 · PRODUCT ANALYTICS · FUNNEL &amp; RETENTION · SQL &amp; BI</text>
      <text class="p-serif" x="54" y="126" font-size="46" font-weight="300" letter-spacing="-1.2" fill="#FFFFFF">Product Funnel &amp; Retention</text>
      <text class="p-sans" x="56" y="166" font-size="17" fill="#C4B5FD">End-to-end product funnel conversion, cohort retention &amp; customer analytics.</text>
      <text class="p-mono" x="56" y="200" font-size="12.5" fill="#DDD6FE"><tspan fill="#38BDF8">BUILT ›</tspan> SQL CTEs &amp; window functions, cohort retention matrix, conversion drop-off &amp; BI</text>
      <line class="p-draw" x1="56" y1="226" x2="680" y2="226" stroke="#8B5CF6" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p-serif" font-size="34" font-weight="300" fill="#FFFFFF">84.6%</text><text class="p-sans" y="24" font-size="12.5" fill="#A79FB5">checkout conversion</text></g>
      <g transform="translate(261 266)"><text class="p-serif" font-size="34" font-weight="300" fill="#FFFFFF">&lt;100ms</text><text class="p-sans" y="24" font-size="12.5" fill="#A79FB5">analytical query latency</text></g>
      <g transform="translate(466 266)"><text class="p-serif" font-size="34" font-weight="300" fill="#FFFFFF">500k+</text><text class="p-sans" y="24" font-size="12.5" fill="#A79FB5">event logs parsed</text></g>
      <g class="p-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="78" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="95.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Python</text></g>
      <g class="p-chip" style="animation-delay:1.12s"><rect x="144" y="314" width="78" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="183.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">SQL</text></g>
      <g class="p-chip" style="animation-delay:1.24s"><rect x="232" y="314" width="94" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="279.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Streamlit</text></g>
      <g class="p-chip" style="animation-delay:1.36s"><rect x="336" y="314" width="78" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="375.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Plotly</text></g>
      <g class="p-chip" style="animation-delay:1.48s"><rect x="424" y="314" width="82" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="465.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Pandas</text></g>
    </g>
    <g class="p-in p-d2">
    <g transform="translate(780 35)">
      <rect x="0" y="0" width="380" height="295" rx="14" fill="#0B0714" stroke="#8B5CF6" stroke-opacity=".35"/>
      <text class="p-mono" x="25" y="32" font-size="10.5" letter-spacing="1.5" fill="#38BDF8">FUNNEL CONVERSION STAGES</text>
      <!-- Funnel Bar 1 -->
      <rect x="25" y="52" width="330" height="28" rx="6" fill="#3B82F6" fill-opacity=".25" stroke="#3B82F6" stroke-opacity=".5"/>
      <text class="p-mono" x="35" y="70" font-size="11" fill="#FFFFFF">1. Landing Page</text>
      <text class="p-mono" x="345" y="70" text-anchor="end" font-size="11" fill="#93C5FD">100% · 500k</text>
      <!-- Funnel Bar 2 -->
      <rect x="25" y="88" width="220" height="28" rx="6" fill="#6366F1" fill-opacity=".25" stroke="#6366F1" stroke-opacity=".5"/>
      <text class="p-mono" x="35" y="106" font-size="11" fill="#FFFFFF">2. Product View</text>
      <text class="p-mono" x="235" y="106" text-anchor="end" font-size="11" fill="#C4B5FD">62.4% · 312k</text>
      <!-- Funnel Bar 3 -->
      <rect x="25" y="124" width="130" height="28" rx="6" fill="#8B5CF6" fill-opacity=".25" stroke="#8B5CF6" stroke-opacity=".5"/>
      <text class="p-mono" x="35" y="142" font-size="11" fill="#FFFFFF">3. Add to Cart</text>
      <text class="p-mono" x="145" y="142" text-anchor="end" font-size="11" fill="#DDD6FE">28.1% · 140k</text>
      <!-- Funnel Bar 4 -->
      <rect x="25" y="160" width="85" height="28" rx="6" fill="#10B981" fill-opacity=".3" stroke="#10B981" stroke-opacity=".6"/>
      <text class="p-mono" x="35" y="178" font-size="11" fill="#FFFFFF">4. Checkout</text>
      <text class="p-mono" x="102" y="178" text-anchor="start" font-size="11" fill="#34D399">18.2% · 91k</text>
      <!-- Cohort Summary Box -->
      <rect x="25" y="204" width="330" height="66" rx="8" fill="#140D24" stroke="#8B5CF6" stroke-opacity=".3"/>
      <text class="p-mono" x="38" y="226" font-size="10.5" letter-spacing="1" fill="#A78BFA">COHORT RETENTION ENGINE</text>
      <text class="p-mono" x="38" y="244" font-size="11" fill="#FFFFFF">Day 1: 58.2%  ·  Day 7: 34.6%  ·  Day 30: 22.1%</text>
      <text class="p-mono" x="38" y="260" font-size="10.5" fill="#10B981">✓ Automated SQL Window Function Engine</text>
    </g>
    </g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#8B5CF6" stroke-opacity=".2"/>
    <rect class="p-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p-aerofault-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>