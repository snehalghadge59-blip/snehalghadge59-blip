<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p-aerofault-t">
  <title id="p-aerofault-t">AeroFaultAI: Real-time aerospace telemetry anomaly detection and predictive diagnostics.</title>
  <defs>
    <linearGradient id="p-aerofault-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140D24"/><stop offset="1" stop-color="#0B0714"/></linearGradient>
    <radialGradient id="p-aerofault-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#7C3AED" stop-opacity=".7"/><stop offset="1" stop-color="#3B0764" stop-opacity="0"/></radialGradient>
    <pattern id="p-aerofault-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8B5CF6" stroke-opacity=".08"/></pattern>
    <clipPath id="p-aerofault-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p-aerofault-trace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .p-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}
    .p-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .p-sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .p-in{animation:p-in 1.2s cubic-bezier(.16,1,.3,1) both}
    .p-d1{animation-delay:.15s} .p-d2{animation-delay:.4s}
    .p-draw{stroke-dasharray:600;stroke-dashoffset:600;animation:p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}
    .p-trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:p-trace 7s linear infinite}
    .p-chip{animation:p-chip .7s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes p-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes p-draw{to{stroke-dashoffset:0}}
    @keyframes p-trace{to{stroke-dashoffset:0}}
    @keyframes p-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.p-in,.p-chip{animation:none}.p-draw{animation:none;stroke-dashoffset:0}.p-trace{display:none}}
  </style>
  <g clip-path="url(#p-aerofault-clip)">
    <rect width="1200" height="370" fill="url(#p-aerofault-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p-aerofault-grid)"/>
    <rect width="1200" height="370" fill="url(#p-aerofault-glow)"/>
    <g class="p-in p-d1">
      <text class="p-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#A78BFA">03 · PREDICTIVE ML · TIME-SERIES TELEMETRY · 2026</text>
      <text class="p-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#FFFFFF">AeroFaultAI</text>
      <text class="p-sans" x="56" y="166" font-size="17" fill="#C4B5FD">Real-time aerospace telemetry anomaly detection and predictive diagnostics.</text>
      <text class="p-mono" x="56" y="200" font-size="12.5" fill="#DDD6FE"><tspan fill="#A78BFA">BUILT ›</tspan> Multi-sensor time-series modeling, anomaly classification, and automated alerts</text>
      <line class="p-draw" x1="56" y1="226" x2="680" y2="226" stroke="#8B5CF6" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p-serif" font-size="34" font-weight="300" fill="#FFFFFF">98.2%</text><text class="p-sans" y="24" font-size="12.5" fill="#A79FB5">anomaly F1-score</text></g>
      <g transform="translate(261 266)"><text class="p-serif" font-size="34" font-weight="300" fill="#FFFFFF">&lt;50ms</text><text class="p-sans" y="24" font-size="12.5" fill="#A79FB5">inference latency</text></g>
      <g transform="translate(466 266)"><text class="p-serif" font-size="34" font-weight="300" fill="#FFFFFF">100k+</text><text class="p-sans" y="24" font-size="12.5" fill="#A79FB5">telemetry records</text></g>
      <g class="p-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="78" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="95.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Python</text></g>
      <g class="p-chip" style="animation-delay:1.12s"><rect x="144" y="314" width="87" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="187.5" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">PyTorch</text></g>
      <g class="p-chip" style="animation-delay:1.24s"><rect x="241" y="314" width="132" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="307.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Scikit-Learn</text></g>
      <g class="p-chip" style="animation-delay:1.36s"><rect x="383" y="314" width="87" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="426.5" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">FastAPI</text></g>
      <g class="p-chip" style="animation-delay:1.48s"><rect x="480" y="314" width="78" height="26" rx="13" fill="#1C1236" stroke="#8B5CF6" stroke-opacity=".35"/><text class="p-mono" x="519.0" y="331" text-anchor="middle" font-size="11.5" fill="#DDD6FE">Plotly</text></g>
    </g>
    <g class="p-in p-d2">
    <g transform="translate(780 35)">
      <rect x="0" y="0" width="380" height="295" rx="14" fill="#0B0714" stroke="#8B5CF6" stroke-opacity=".35"/>
      <text class="p-mono" x="35" y="34" font-size="10.5" letter-spacing="1.5" fill="#A78BFA">LIVE TELEMETRY STREAM</text>
      <!-- Waveform -->
      <path d="M30 110 L80 110 L100 82 L120 138 L140 110 L190 110 L210 58 L230 162 L250 110 L300 110 L350 110" fill="none" stroke="#8B5CF6" stroke-width="2"/>
      <!-- Fault circle pulse -->
      <circle cx="220" cy="110" r="26" fill="#EF4444" fill-opacity=".12" stroke="#EF4444" stroke-width="1.2">
        <animate attributeName="r" values="18;30;18" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text class="p-mono" x="220" y="52" text-anchor="middle" font-size="10" fill="#EF4444">FAULT SPIKE DETECTED</text>
      <!-- Diagnostics -->
      <rect x="30" y="195" width="320" height="72" rx="10" fill="#140D24" stroke="#8B5CF6" stroke-opacity=".3"/>
      <text class="p-mono" x="48" y="220" font-size="11" fill="#FFFFFF">STATUS: Component #4 Failure Risk</text>
      <text class="p-mono" x="48" y="240" font-size="10.5" fill="#DDD6FE">Confidence: 98.2%  ·  TTF: 48h</text>
      <text class="p-mono" x="48" y="258" font-size="10" fill="#10B981">Action: Maintenance Ticket Dispatched</text>
    </g>
    </g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#8B5CF6" stroke-opacity=".2"/>
    <rect class="p-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p-aerofault-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>