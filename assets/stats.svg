          <text x="0" y="0" font-size="13" font-family="'DejaVu Sans',sans-serif" fill="#e6d9ff">Total Stars</text>
          <text x="228" y="0" text-anchor="end" font-size="13" font-weight="bold" font-family="'DejaVu Sans',sans-serif" fill="#ff9ff0">18</text>
          <rect x="0" y="8" width="228" height="3" rx="1.5" fill="#3a2050"/>
          <rect x="0" y="8" width="0" height="3" rx="1.5" fill="url(#ringGrad2)">
