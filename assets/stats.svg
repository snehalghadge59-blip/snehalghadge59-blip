<svg width="480" height="260" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg"><defs>
      <clipPath id="statsRound"><rect x="0" y="0" width="480" height="260" rx="18"/></clipPath>
      <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#150818"/>
        <stop offset="100%" stop-color="#2a0a3d"/>
      </linearGradient>
      <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff5fd6"/>
        <stop offset="100%" stop-color="#8b3fff"/>
      </linearGradient>
      <filter id="sGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs><g clip-path="url(#statsRound)"><rect x="0" y="0" width="480" height="260" fill="url(#sBg)"/><rect x="0.5" y="0.5" width="479" height="259" rx="18" fill="none" stroke="#ff8fe6" stroke-opacity="0.35"/><text x="24" y="34" font-size="16" font-weight="bold" font-family="'DejaVu Sans',sans-serif" fill="#f5e6ff">Snehal's GitHub Stats</text><circle cx="110" cy="155" r="62" fill="none" stroke="#3a2050" stroke-width="12"/>
    <circle cx="110" cy="155" r="62" fill="none" stroke="url(#ringGrad2)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="303.9 389.6" transform="rotate(-90 110 155)" filter="url(#sGlow)">
      <animate attributeName="stroke-dasharray" values="0 389.6;303.9 389.6" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </circle>
    <text x="110" y="161" text-anchor="middle" font-size="22" font-weight="bold" font-family="'DejaVu Sans',sans-serif" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>A+</text>
