        </g><g transform="translate(228,102)" opacity="0">
          <animateTransform attributeName="transform" type="translate" from="268,102" to="228,102" begin="0.58s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
          <animate attributeName="opacity" from="0" to="1" begin="0.58s" dur="0.5s" fill="freeze"/>
          <text x="0" y="0" font-size="13" font-family="'DejaVu Sans',sans-serif" fill="#e6d9ff">Total Commits (2026)</text>
          <text x="228" y="0" text-anchor="end" font-size="13" font-weight="bold" font-family="'DejaVu Sans',sans-serif" fill="#ff9ff0">1500+</text>
          <rect x="0" y="8" width="228" height="3" rx="1.5" fill="#3a2050"/>
          <rect x="0" y="8" width="0" height="3" rx="1.5" fill="url(#ringGrad2)">
