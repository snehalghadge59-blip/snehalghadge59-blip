          <animate attributeName="opacity" from="0" to="1" begin="0.94s" dur="0.5s" fill="freeze"/>
          <text x="0" y="0" font-size="13" font-family="'DejaVu Sans',sans-serif" fill="#e6d9ff">Total Repos</text>
