<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 360" width="370" height="360">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    .title-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; font-weight: bold; fill: #8b949e; }
    .ascii-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #58a6ff; font-weight: bold; xml:space: preserve; }
    .ascii-row {
      opacity: 0;
      animation: typeRow 0.1s linear forwards;
    }
    @keyframes typeRow {
      to {
        opacity: 1;
      }
    }
  </style>

  <rect width="370" height="360" class="bg" />

  <!-- Terminal Header Bar -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="38" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="20" r="6" fill="#27c93f" />
  <text x="75" y="24" class="title-text">snehal@ascii: ~ (portrait)</text>
  <line x1="0" y1="36" x2="370" y2="36" stroke="#21262d" stroke-width="1" />

  <!-- Self-typing ASCII Rows -->
  <g class="ascii-row" style="animation-delay: 0.0s;">
      <text x="20" y="55" class="ascii-text">   .---------------------------------.  </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.04s;">
      <text x="20" y="69" class="ascii-text">  /   _   _   _   _   _   _   _   _   \ </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.08s;">
      <text x="20" y="83" class="ascii-text">  |  (S) (N) (E) (H) (A) (L) (G) (H)  | </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.12s;">
      <text x="20" y="97" class="ascii-text">  \___________________________________/ </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.16s;">
      <text x="20" y="111" class="ascii-text">        _        _               _      </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.2s;">
      <text x="20" y="125" class="ascii-text">     .-' '-.  .-' '-.         .-' '-.   </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.24s;">
      <text x="20" y="139" class="ascii-text">    /   .   \/   .   \       /   .   \  </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.28s;">
      <text x="20" y="153" class="ascii-text">   |   / \  ||  / \   |     |   / \   | </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.32s;">
      <text x="20" y="167" class="ascii-text">   |  |   | || |   |  |     |  |   |  | </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.36s;">
      <text x="20" y="181" class="ascii-text">    \  \_/  /\  \_/  /       \  \_/  /  </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.4s;">
      <text x="20" y="195" class="ascii-text">     '-...-'  '-...-'         '-...-'   </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.44s;">
      <text x="20" y="209" class="ascii-text">    _________________________________   </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.48s;">
      <text x="20" y="223" class="ascii-text">   /                                 \  </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.52s;">
      <text x="20" y="237" class="ascii-text">  |  [+] ARTIFICIAL INTELLIGENCE     |  </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.56s;">
      <text x="20" y="251" class="ascii-text">  |  [+] MACHINE LEARNING ENGINEER   |  </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.6s;">
      <text x="20" y="265" class="ascii-text">  |  [+] AGENTIC RAG ARCHITECT       |  </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.64s;">
      <text x="20" y="279" class="ascii-text">  |  [+] DATA ANALYTICS &amp; SYSTEMS    |  </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.68s;">
      <text x="20" y="293" class="ascii-text">  \_________________________________/   </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.72s;">
      <text x="20" y="307" class="ascii-text">    \_______________________________/   </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.76s;">
      <text x="20" y="321" class="ascii-text">       \                         /      </text>
    </g>
    <g class="ascii-row" style="animation-delay: 0.8s;">
      <text x="20" y="335" class="ascii-text">        `-----------------------'       </text>
    </g>
</svg>
